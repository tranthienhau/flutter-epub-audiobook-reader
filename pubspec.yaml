name: inkwell
description: "Inkwell - EPUB reader, audiobook streaming, daily editorial and premium membership in Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.6.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  shared_preferences: ^2.5.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/books/
    - assets/audio/
    - assets/cms/
  fonts:
    - family: MPlusRounded
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
