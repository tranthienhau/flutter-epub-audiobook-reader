                  const icon = document.getElementById('toggle-icon');
                  if (pwd.type === 'password') {
                    pwd.type = 'text';
                    pwd.classList.remove('tracking-widest');
                    icon.textContent = 'visibility_off';
                  } else {
                    pwd.type = 'password';
                    pwd.classList.add('tracking-widest');
                    icon.textContent = 'visibility';
