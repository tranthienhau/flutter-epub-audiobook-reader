<!-- Lightweight Inline Interactions -->
<script>
    // Play/Pause micro-toggle
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    let isPlaying = true;

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      playPauseBtn.classList.toggle('scale-95');
      setTimeout(() => playPauseBtn.classList.remove('scale-95'), 150);
    });

    // Favorite heart toggle
    const favBtn = document.getElementById('favorite-btn');
    const heartIcon = document.getElementById('heart-icon');
    let isFav = true;

    favBtn.addEventListener('click', () => {
      isFav = !isFav;
      if (isFav) {
        heartIcon.style.fontVariationSettings = "'FILL' 1";
        favBtn.classList.remove('text-text-tertiary', 'bg-surface-alt');
        favBtn.classList.add('text-primary', 'bg-accent-tint');
      } else {
        heartIcon.style.fontVariationSettings = "'FILL' 0";
        favBtn.classList.remove('text-primary', 'bg-accent-tint');
        favBtn.classList.add('text-text-tertiary', 'bg-surface-alt');
      }
    });
  </script>
